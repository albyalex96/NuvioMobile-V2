name: Build & Release (push)

# Builds the signed Android full release on every push to enhanced/v2 and publishes a GitHub
# release (tag v<version> from version.json) with generated release notes.
# The Android TV APKs are built right after the phone ones (job build-tv) and attached to the
# same release as Nuvio-Enhanced-Alby-TV-<version>-<abi>.apk.
# A release is created only when version.json carries a version that has not been released
# yet: pushes without a version bump still build and upload the APKs as workflow artifacts.
# The Windows desktop installer (MSI) is built on a Windows runner (job build-desktop) and attached
# to the same release as Nuvio-Enhanced-Alby-Desktop-<version>-windows-x64.msi.
# It can also be started by hand from the Actions tab (Run workflow); there the release can be
# skipped to only build the APKs.

on:
  push:
    branches:
      - enhanced/v2
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the GitHub release (only when the version in version.json is not released yet)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: v2-push-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      release_exists: ${{ steps.version.outputs.release_exists }}
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read version.json
        id: version
        run: |
          version="$(jq -er '.version' version.json)"
          tag="v${version}"
          prerelease=false
          [[ "${version}" == *-* ]] && prerelease=true
          release_exists=false
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" >/dev/null 2>&1 \
            || git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            release_exists=true
            echo "::notice::${tag} already released; bump version.json to publish a new release. Building artifacts only."
          fi
          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "prerelease=${prerelease}"
            echo "release_exists=${release_exists}"
          } >> "${GITHUB_OUTPUT}"

  build:
    name: Build Android release
    needs: version
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
      RELEASE_KEYSTORE_BASE64: ${{ secrets.NUVIO_RELEASE_KEYSTORE_BASE64 }}

    steps:
      - name: Check out full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure release signing
        run: |
          missing=()
          [[ -n "${RELEASE_PROPERTIES_BASE64}" ]] || missing+=(NUVIO_LOCAL_PROPERTIES_BASE64)
          [[ -n "${RELEASE_KEYSTORE_BASE64}" ]] || missing+=(NUVIO_RELEASE_KEYSTORE_BASE64)
          if (( ${#missing[@]} > 0 )); then
            echo "Missing repository secrets: ${missing[*]}" >&2
            echo "Release APKs must be signed with the same key as the installed app for in-app updates to work." >&2
            exit 1
          fi

          keystore_path="${RUNNER_TEMP}/nuvio-release.jks"
          printf '%s' "${RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
          printf '%s' "${RELEASE_PROPERTIES_BASE64}" | base64 --decode > local.properties
          sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties
          printf '\nNUVIO_RELEASE_STORE_FILE=%s\n' "${keystore_path}" >> local.properties

          for property_name in NUVIO_RELEASE_STORE_PASSWORD NUVIO_RELEASE_KEY_ALIAS NUVIO_RELEASE_KEY_PASSWORD; do
            if ! grep -Eq "^${property_name}=.+" local.properties; then
              echo "Missing required property in NUVIO_LOCAL_PROPERTIES_BASE64: ${property_name}" >&2
              exit 1
            fi
          done

      - name: Preinstall CMake
        # The native module configures one ABI per task in parallel: installing CMake from
        # several tasks at once can read a half-written zip and fail the build.
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.22.1" > /dev/null

      - name: Build full release APKs
        run: ./gradlew :androidApp:assembleFullRelease --stacktrace -Dorg.gradle.jvmargs="-Xmx7g -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8" -Pkotlin.daemon.jvmargs=-Xmx6g

      - name: Rename APKs
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          for apk in androidApp/build/outputs/apk/full/release/*.apk; do
            abi="$(basename "${apk}" .apk | sed -E 's/^androidApp-full-//; s/-release(-unsigned)?$//')"
            cp "${apk}" "dist/Nuvio-Enhanced-Alby-${VERSION}-${abi}.apk"
          done
          ls -l dist

      - name: Generate release notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          previous_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD 2>/dev/null || true)"
          if [[ -n "${previous_tag}" && "${previous_tag}" != "${TAG}" ]]; then
            from_ref="${previous_tag}"
          else
            # First v2 release: start from the commit that introduced version.json.
            from_ref="$(git log --diff-filter=A --format='%H' -- version.json | tail -n 1)"
          fi

          ./scripts/generate-release-notes.sh \
            --from "${from_ref}" \
            --to "${GITHUB_SHA}" \
            --repository "${GITHUB_REPOSITORY}" \
            > dist/release-notes.md || true
          if [[ ! -s dist/release-notes.md ]]; then
            echo "- Maintenance release" > dist/release-notes.md
          fi
          if [[ -n "${previous_tag}" && "${previous_tag}" != "${TAG}" ]]; then
            printf '\n**Full changelog:** https://github.com/%s/compare/%s...%s\n' \
              "${GITHUB_REPOSITORY}" "${previous_tag}" "${TAG}" >> dist/release-notes.md
          fi

          {
            echo "## ${VERSION} release notes"
            echo
            cat dist/release-notes.md
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-${{ steps.version.outputs.version }}-android-full-release
          path: dist/*
          if-no-files-found: error

  build-tv:
    name: Build Android TV release
    needs: version
    runs-on: ubuntu-latest
    env:
      RELEASE_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
      RELEASE_KEYSTORE_BASE64: ${{ secrets.NUVIO_RELEASE_KEYSTORE_BASE64 }}
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure release signing
        run: |
          missing=()
          [[ -n "${RELEASE_PROPERTIES_BASE64}" ]] || missing+=(NUVIO_LOCAL_PROPERTIES_BASE64)
          [[ -n "${RELEASE_KEYSTORE_BASE64}" ]] || missing+=(NUVIO_RELEASE_KEYSTORE_BASE64)
          if (( ${#missing[@]} > 0 )); then
            echo "Missing repository secrets: ${missing[*]}" >&2
            exit 1
          fi

          keystore_path="${RUNNER_TEMP}/nuvio-release.jks"
          printf '%s' "${RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
          printf '%s' "${RELEASE_PROPERTIES_BASE64}" | base64 --decode > local.properties
          sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties
          printf '\nNUVIO_RELEASE_STORE_FILE=%s\n' "${keystore_path}" >> local.properties

      - name: Preinstall CMake
        # The native module configures one ABI per task in parallel: installing CMake from
        # several tasks at once can read a half-written zip and fail the build.
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.22.1" > /dev/null

      - name: Build TV release APKs
        run: ./gradlew :tvApp:assembleFullRelease --stacktrace -Dorg.gradle.jvmargs="-Xmx7g -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8" -Pkotlin.daemon.jvmargs=-Xmx6g

      - name: Rename APKs
        # The "TV" token in the file name is how the in-app updater tells TV APKs apart
        # (isTvApkAssetName): keep it as a standalone, dash-separated word.
        run: |
          mkdir -p dist-tv
          for apk in tvApp/build/outputs/apk/full/release/*.apk; do
            abi="$(basename "${apk}" .apk | sed -E 's/^tvApp-full-//; s/-release(-unsigned)?$//')"
            cp "${apk}" "dist-tv/Nuvio-Enhanced-Alby-TV-${VERSION}-${abi}.apk"
          done
          ls -l dist-tv

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-${{ needs.version.outputs.version }}-android-tv-full-release
          path: dist-tv/*
          if-no-files-found: error

  build-desktop:
    name: Build Windows desktop installer
    needs: version
    runs-on: windows-latest
    env:
      RELEASE_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure runtime properties
        # Same local.properties as Android (Supabase, TMDB...); no signing key is needed for the MSI.
        run: |
          if [[ -z "${RELEASE_PROPERTIES_BASE64}" ]]; then
            echo "Missing repository secret: NUVIO_LOCAL_PROPERTIES_BASE64" >&2
            exit 1
          fi
          printf '%s' "${RELEASE_PROPERTIES_BASE64}" | base64 --decode > local.properties
          sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties

      - name: Build MSI
        # downloadDesktopLibmpv (libmpv-2.dll, verified by SHA-256) runs as part of packaging.
        run: ./gradlew :composeApp:packageMsi --stacktrace -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8"

      - name: Rename MSI
        run: |
          mkdir -p dist-desktop
          msi="$(ls composeApp/build/compose/binaries/main/msi/*.msi | head -n 1)"
          cp "${msi}" "dist-desktop/Nuvio-Enhanced-Alby-Desktop-${VERSION}-windows-x64.msi"
          ls -l dist-desktop

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-${{ needs.version.outputs.version }}-desktop-windows
          path: dist-desktop/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [version, build, build-tv, build-desktop]
    if: needs.version.outputs.release_exists != 'true' && (github.event_name != 'workflow_dispatch' || inputs.publish_release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}

    steps:
      - name: Download phone artifacts
        uses: actions/download-artifact@v8
        with:
          name: nuvio-${{ needs.version.outputs.version }}-android-full-release
          path: dist

      - name: Download TV artifacts
        uses: actions/download-artifact@v8
        with:
          name: nuvio-${{ needs.version.outputs.version }}-android-tv-full-release
          path: dist

      - name: Download desktop artifacts
        uses: actions/download-artifact@v8
        with:
          name: nuvio-${{ needs.version.outputs.version }}-desktop-windows
          path: dist

      - name: Create release
        run: |
          release_args=(
            "${TAG}"
            --repo "${GITHUB_REPOSITORY}"
            --target "${GITHUB_SHA}"
            --title "Nuvio Enhanced ${VERSION}"
            --notes-file dist/release-notes.md
          )
          if [[ "${PRERELEASE}" == "true" ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${release_args[@]}" dist/*.apk dist/*.msi
